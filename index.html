<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>스위치온 100만원 보상 트래커</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Confetti 효과 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --card-hover: #1f2430;
      --border: #2a3040;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.25);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* 로그인 화면 */
    .auth-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .auth-card h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      text-align: center;
    }

    .auth-card p {
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    input[type="date"],
    input[type="number"],
    input[type="text"] {
      width: 100%;
      background: #11131a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      font-size: 0.8rem;
      width: auto;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 12px;
      text-align: center;
      word-break: break-word;
    }

    /* 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title-area h1 {
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.72rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* 대시보드 카드 */
    .dashboard {
      background: linear-gradient(145deg, #1a1f2c, #141720);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .reward-hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .reward-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .reward-amount {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 24px var(--gold-glow);
      letter-spacing: -0.5px;
    }

    .reward-sub {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: rgba(17, 19, 26, 0.7);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .stat-box .label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-box .value {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .progress-wrap {
      background: #11131a;
      border-radius: 999px;
      height: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #f59e0b);
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* 기록 입력 폼 */
    .input-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 540px) {
      .input-row {
        grid-template-columns: 1fr 1fr;
      }
      .input-row button {
        grid-column: span 2;
      }
    }

    /* 섹션 타이틀 & 모드 전환 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 26px 0 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .section-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .mode-toggle {
      display: inline-flex;
      background: #11131a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--card-hover);
      color: var(--text);
    }

    /* 마일스톤 그리드 */
    .milestone-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .milestone-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      transition: all 0.25s ease;
      position: relative;
    }

    .milestone-card.unlocked {
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.12), rgba(16, 185, 129, 0.08));
      border-color: rgba(245, 158, 11, 0.6);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.12);
    }

    .milestone-card.next-target {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-glow);
    }

    .ms-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .ms-weight {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .ms-status {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #11131a;
      color: var(--muted);
    }

    .milestone-card.unlocked .ms-status {
      background: var(--gold);
      color: #111;
    }

    .milestone-card.next-target .ms-status {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent);
    }

    .ms-reward {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 2px;
    }

    .milestone-card.unlocked .ms-reward {
      color: var(--gold);
    }

    .ms-cum {
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .ms-memo {
      width: 100%;
      background: rgba(17, 19, 26, 0.75);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.8rem;
      color: var(--text);
    }

    /* 차트 & 히스토리 */
    .chart-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
    }

    svg {
      width: 100%;
      height: 190px;
      overflow: visible;
    }

    .history-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
    }

    .del-btn:hover {
      color: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 로그인 뷰 -->
  <div id="authSection" class="container auth-wrapper">
    <div class="auth-card">
      <h1>🔥 스위치온 100만 트래커</h1>
      <p>Supabase 계정에 로그인해 기록을 동기화합니다</p>
      <form id="loginForm">
        <div class="form-group">
          <label>이메일</label>
          <input type="email" id="loginEmail" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">로그인</button>
        <div id="authError" class="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- 메인 앱 뷰 -->
  <div id="appSection" class="container hidden">
    <header>
      <div class="title-area">
        <h1>스위치온 100만 <span class="badge">☁️ DB 동기화</span></h1>
      </div>
      <button class="btn btn-ghost" id="logoutBtn">로그아웃</button>
    </header>

    <!-- 대시보드 -->
    <section class="dashboard">
      <div class="reward-hero">
        <div>
          <div class="reward-label">현재까지 획득한 보상금</div>
          <div class="reward-amount" id="earnedAmount">0원</div>
        </div>
        <div class="reward-sub" id="nextGoalText">다음 목표: 114.0kg (-1.0kg 남음)</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="label">현재 체중</div>
          <div class="value" id="currentWeightDisplay">115.0 kg</div>
        </div>
        <div class="stat-box">
          <div class="label">총 감량</div>
          <div class="value" style="color: var(--accent);" id="lostWeightDisplay">0.0 kg</div>
        </div>
        <div class="stat-box">
          <div class="label">목표 달성률</div>
          <div class="value" id="progressPercent">0%</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-info">
        <span>시작 115.0kg</span>
        <span>1차 목표 102.0kg (총 1,000,000원)</span>
      </div>
    </section>

    <!-- 체중 입력 -->
    <section class="input-card">
      <form id="weightForm" class="input-row">
        <input type="date" id="recordDate" required />
        <input type="number" id="recordWeight" step="0.1" min="50" max="200" placeholder="체중 (kg)" required />
        <button type="submit" class="btn btn-primary" id="saveBtn">기록 저장</button>
      </form>
    </section>

    <!-- 보상 로드맵 -->
    <div class="section-header">
      <h2>💰 구간별 보상 로드맵 (13단계)</h2>
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="progressive">후반 가속형</button>
        <button class="mode-btn" data-mode="equal">균등 배분형</button>
      </div>
    </div>
    <section class="milestone-grid" id="milestoneGrid"></section>

    <!-- 체중 그래프 -->
    <div class="section-header">
      <h2>📈 감량 추이 그래프</h2>
    </div>
    <section class="chart-box">
      <svg id="weightChart" viewBox="0 0 600 180"></svg>
    </section>

    <!-- 기록 내역 -->
    <div class="section-header">
      <h2>🗓️ 최근 체중 기록</h2>
    </div>
    <section class="history-list" id="historyList"></section>
  </div>

  <div id="toast" class="toast">저장되었습니다</div>

  <script>
    // ==========================================
    // Supabase 연결 설정
    // ==========================================
    const SUPABASE_URL = 'https://criseqnhzqmzqtkkrjce.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7f-R4BDcbrFL2hOENFEwPw_zyT_Zp6q';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 기본 설정값
    const START_WEIGHT = 115.0;
    const GOAL_WEIGHT = 102.0;

    // 13단계 보상 설계 (합계 정확히 1,000,000원)
    const REWARD_PLANS = {
      progressive: [
        { target: 114, amount: 30000 },
        { target: 113, amount: 30000 },
        { target: 112, amount: 40000 },
        { target: 111, amount: 40000 },
        { target: 110, amount: 70000 },
        { target: 109, amount: 50000 },
        { target: 108, amount: 60000 },
        { target: 107, amount: 70000 },
        { target: 106, amount: 80000 },
        { target: 105, amount: 110000 },
        { target: 104, amount: 100000 },
        { target: 103, amount: 120000 },
        { target: 102, amount: 200000 }
      ],
      equal: [
        { target: 114, amount: 75000 },
        { target: 113, amount: 75000 },
        { target: 112, amount: 75000 },
        { target: 111, amount: 75000 },
        { target: 110, amount: 80000 },
        { target: 109, amount: 75000 },
        { target: 108, amount: 75000 },
        { target: 107, amount: 75000 },
        { target: 106, amount: 75000 },
        { target: 105, amount: 80000 },
        { target: 104, amount: 75000 },
        { target: 103, amount: 75000 },
        { target: 102, amount: 90000 }
      ]
    };

    let currentUser = null;
    let logs = [];
    let memos = {};
    let currentMode = localStorage.getItem('reward_mode') || 'progressive';
    let lastUnlockedCount = null;

    // DOM 요소
    const authSection = document.getElementById('authSection');
    const appSection = document.getElementById('appSection');
    const loginForm = document.getElementById('loginForm');
    const authError = document.getElementById('authError');
    const recordDateInput = document.getElementById('recordDate');

    // 오늘 날짜 기본 세팅 (한국 시간 기준)
    const todayKST = new Date(Date.now() + 9 * 3600 * 1000).toISOString().split('T')[0];
    recordDateInput.value = todayKST;

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 세션 체크 및 초기화
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        currentUser = session.user;
        showApp();
      } else {
        showAuth();
      }

      sb.auth.onAuthStateChange((_event, session) => {
        if (session) {
          currentUser = session.user;
          showApp();
        } else {
          currentUser = null;
          showAuth();
        }
      });
    }

    function showAuth() {
      authSection.classList.remove('hidden');
      appSection.classList.add('hidden');
    }

    async function showApp() {
      authSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      updateModeButtons();
      await fetchAllData();
    }

    // 로그인 처리 (실제 에러 원인 출력)
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.textContent = '';
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.textContent = '로그인 중...';

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          authError.textContent = `에러(${error.status || 'Auth'}): ${error.message}`;
        }
      } catch (err) {
        authError.textContent = `연결 오류: ${err.message}`;
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '로그인';
      }
    });

    // 로그아웃
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
    });

    // DB에서 데이터 불러오기
    async function fetchAllData() {
      const [logsRes, memosRes] = await Promise.all([
        sb.from('weight_logs').select('*').order('recorded_date', { ascending: true }).order('created_at', { ascending: true }),
        sb.from('milestone_memos').select('*')
      ]);

      if (logsRes.error) {
        showToast('데이터 불러오기 오류: ' + logsRes.error.message);
        return;
      }

      logs = logsRes.data || [];
      memos = {};
      (memosRes.data || []).forEach(row => {
        memos[row.target_weight] = row.memo;
      });

      renderAll();
    }

    // 체중 기록 추가
    document.getElementById('weightForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const recorded_date = recordDateInput.value;
      const weight = parseFloat(document.getElementById('recordWeight').value);
      if (!recorded_date || isNaN(weight)) return;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';

      const { error } = await sb.from('weight_logs').insert([
        { user_id: currentUser.id, recorded_date, weight }
      ]);

      saveBtn.disabled = false;
      saveBtn.textContent = '기록 저장';

      if (error) {
        showToast('저장 실패: ' + error.message);
      } else {
        document.getElementById('recordWeight').value = '';
        showToast('체중이 DB에 저장되었습니다!');
        await fetchAllData();
      }
    });

    // 체중 기록 삭제
    async function deleteLog(id) {
      if (!confirm('이 기록을 삭제할까요?')) return;
      const { error } = await sb.from('weight_logs').delete().eq('id', id);
      if (error) {
        showToast('삭제 실패: ' + error.message);
      } else {
        showToast('삭제되었습니다');
        await fetchAllData();
      }
    }

    // 메모 저장 (디바운스 적용)
    let memoTimers = {};
    function handleMemoInput(targetWeight, value) {
      memos[targetWeight] = value;
      clearTimeout(memoTimers[targetWeight]);
      memoTimers[targetWeight] = setTimeout(async () => {
        const { error } = await sb.from('milestone_memos').upsert(
          { user_id: currentUser.id, target_weight: targetWeight, memo: value, updated_at: new Date().toISOString() },
          { onConflict: 'user_id,target_weight' }
        );
        if (!error) showToast(`${targetWeight}kg 보상 메모 저장됨`);
      }, 700);
    }

    // 배분 모드 전환
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMode = btn.dataset.mode;
        localStorage.setItem('reward_mode', currentMode);
        updateModeButtons();
        renderAll(false);
      });
    });

    function updateModeButtons() {
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === currentMode);
      });
    }

    // 전체 UI 렌더링
    function renderAll(checkCelebration = true) {
      const currentWeight = logs.length > 0 ? Number(logs[logs.length - 1].weight) : START_WEIGHT;
      const minWeight = logs.length > 0 ? Math.min(START_WEIGHT, ...logs.map(l => Number(l.weight))) : START_WEIGHT;

      const lost = Math.max(0, START_WEIGHT - currentWeight);
      const totalToLose = START_WEIGHT - GOAL_WEIGHT;
      const pct = Math.min(100, Math.max(0, (lost / totalToLose) * 100));

      const plan = REWARD_PLANS[currentMode];
      let earned = 0;
      let unlockedCount = 0;
      let nextTarget = null;

      plan.forEach(item => {
        if (minWeight <= item.target) {
          earned += item.amount;
          unlockedCount++;
        } else if (!nextTarget) {
          nextTarget = item;
        }
      });

      if (checkCelebration && lastUnlockedCount !== null && unlockedCount > lastUnlockedCount) {
        confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
      }
      lastUnlockedCount = unlockedCount;

      document.getElementById('earnedAmount').textContent = earned.toLocaleString() + '원';
      document.getElementById('currentWeightDisplay').textContent = currentWeight.toFixed(1) + ' kg';
      document.getElementById('lostWeightDisplay').textContent = '-' + lost.toFixed(1) + ' kg';
      document.getElementById('progressPercent').textContent = pct.toFixed(1) + '%';
      document.getElementById('progressBar').style.width = pct + '%';

      if (nextTarget) {
        const diff = (currentWeight - nextTarget.target).toFixed(1);
        document.getElementById('nextGoalText').textContent =
          `다음 목표: ${nextTarget.target}.0kg (${diff > 0 ? '-' + diff + 'kg 남음' : '달성 임박!'})`;
      } else {
        document.getElementById('nextGoalText').textContent = '🎉 1차 목표 102kg 완전 정복!';
      }

      const grid = document.getElementById('milestoneGrid');
      grid.innerHTML = '';
      let cumulative = 0;

      plan.forEach(item => {
        cumulative += item.amount;
        const isUnlocked = minWeight <= item.target;
        const isNext = nextTarget && nextTarget.target === item.target;

        const card = document.createElement('div');
        card.className = `milestone-card ${isUnlocked ? 'unlocked' : ''} ${isNext ? 'next-target' : ''}`;
        card.innerHTML = `
          <div class="ms-top">
            <span class="ms-weight">${item.target}.0 kg</span>
            <span class="ms-status">${isUnlocked ? 'UNLOCKED' : isNext ? 'NEXT GOAL' : 'LOCKED'}</span>
          </div>
          <div class="ms-reward">+${item.amount.toLocaleString()}원</div>
          <div class="ms-cum">누적 보상: ${cumulative.toLocaleString()}원</div>
          <input type="text" class="ms-memo" placeholder="보상 사용처 메모 (예: 치팅데이, 옷 구매)"
            value="${(memos[item.target] || '').replace(/"/g, '&quot;')}"
            oninput="handleMemoInput(${item.target}, this.value)" />
        `;
        grid.appendChild(card);
      });

      renderChart();
      renderHistory();
    }

    // SVG 차트 렌더링
    function renderChart() {
      const svg = document.getElementById('weightChart');
      const W = 600, H = 180;
      const padL = 38, padR = 16, padT = 16, padB = 26;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;

      const pointsData = logs.length > 0
        ? logs.map(l => ({ date: l.recorded_date.slice(5), weight: Number(l.weight) }))
        : [{ date: '시작', weight: START_WEIGHT }];

      const allWeights = [START_WEIGHT, GOAL_WEIGHT, ...pointsData.map(p => p.weight)];
      const maxW = Math.max(...allWeights) + 0.5;
      const minW = Math.min(...allWeights) - 0.5;

      const getY = w => padT + ((maxW - w) / (maxW - minW)) * chartH;
      const getX = i => pointsData.length === 1
        ? padL + chartW / 2
        : padL + (i / (pointsData.length - 1)) * chartW;

      const yStart = getY(START_WEIGHT);
      const yGoal = getY(GOAL_WEIGHT);

      let svgContent = `
        <line x1="${padL}" y1="${yStart}" x2="${W - padR}" y2="${yStart}" stroke="#374151" stroke-dasharray="4 4" />
        <text x="4" y="${yStart + 4}" fill="#9ca3af" font-size="10">115k</text>

        <line x1="${padL}" y1="${yGoal}" x2="${W - padR}" y2="${yGoal}" stroke="#f59e0b" stroke-dasharray="4 4" opacity="0.7" />
        <text x="4" y="${yGoal + 4}" fill="#f59e0b" font-size="10">102k</text>
      `;

      if (pointsData.length > 1) {
        const polyPoints = pointsData.map((p, i) => `${getX(i)},${getY(p.weight)}`).join(' ');
        svgContent += `<polyline fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polyPoints}" />`;
      }

      pointsData.forEach((p, i) => {
        const cx = getX(i);
        const cy = getY(p.weight);
        svgContent += `
          <circle cx="${cx}" cy="${cy}" r="4.5" fill="#10b981" stroke="#0f1117" stroke-width="2" />
          <text x="${cx}" y="${cy - 9}" fill="#f3f4f6" font-size="10" text-anchor="middle" font-weight="bold">${p.weight.toFixed(1)}</text>
          <text x="${cx}" y="${H - 6}" fill="#9ca3af" font-size="9.5" text-anchor="middle">${p.date}</text>
        `;
      });

      svg.innerHTML = svgContent;
    }

    // 기록 히스토리 렌더링
    function renderHistory() {
      const list = document.getElementById('historyList');
      if (logs.length === 0) {
        list.innerHTML = `<div class="history-item" style="color: var(--muted); justify-content: center;">아직 기록이 없습니다. 첫 체중을 입력해 보세요!</div>`;
        return;
      }

      const reversed = [...logs].reverse();
      list.innerHTML = reversed.map((item, idx) => {
        const prev = reversed[idx + 1];
        let diffHtml = '';
        if (prev) {
          const diff = (Number(item.weight) - Number(prev.weight)).toFixed(1);
          const color = diff < 0 ? '#10b981' : diff > 0 ? '#ef4444' : '#9ca3af';
          const sign = diff > 0 ? '+' : '';
          diffHtml = `<span style="color:${color}; font-size:0.8rem; margin-left:8px;">(${sign}${diff}kg)</span>`;
        }
        return `
          <div class="history-item">
            <div>
              <span style="color: var(--muted); margin-right: 12px;">${item.recorded_date}</span>
              <strong>${Number(item.weight).toFixed(1)} kg</strong>
              ${diffHtml}
            </div>
            <button class="del-btn" onclick="deleteLog('${item.id}')">삭제</button>
          </div>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
